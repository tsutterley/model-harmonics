[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "model-harmonics"
version = "1.1.3"
description = "Python tools for working with model synthetic spherical harmonic fields"
keywords = [
    "gravity",
    "physical geodesy",
    "satellite geodesy",
    "spherical harmonics",
]

authors = [
    {name = "Tyler Sutterley"},
    {name = "Yara Mohajerani"},
    {name = "Isabella Velicogna"},
    {email = "tsutterl@uw.edu"}
]
maintainers = [{ name = "model-harmonics contributors" }]
license = "MIT"
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}

requires-python = "~=3.6"
dependencies = [
    "cdsapi",
    "ecmwf-datastores-client",
    "fiona",
    "geoid-toolkit",
    "gravity-toolkit",
    "h5py",
    "netCDF4",
    "pyproj",
    "shapely",
    "scikit-learn",
]

classifiers=[
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://model-harmonics.readthedocs.io"
Documentation = "https://model-harmonics.readthedocs.io"
Repository = "https://github.com/polargeodesy/model-harmonics"
Issues = "https://github.com/polargeodesy/model-harmonics/issues"

[project.optional-dependencies]
doc = ["docutils", "graphviz", "myst-nb", "numpydoc", "sphinx", "sphinx-argparse>=0.4", "sphinxcontrib-bibtex", "sphinx-design", "sphinx_rtd_theme"]
dev = ["flake8", "pytest>=4.6", "pytest-cov", "pytest-xdist"]
grib = ["cython", "eccodes", "pygrib"]

[project.scripts]
# Utilities (scripts)
"harmonic_operators.py" = "model_harmonics.scripts.harmonic_operators:main"
"least_squares_mascons.py" = "model_harmonics.scripts.least_squares_mascons:main"
"least_squares_mascon_timeseries.py" = "model_harmonics.scripts.least_squares_mascon_timeseries:main"
"regress_maps.py" = "model_harmonics.scripts.regress_maps:main"
"spatial_operators.py" = "model_harmonics.scripts.spatial_operators:main"
# Data Access (datasets)
"cds_land_retrieve.py" = "model_harmonics.datasets.cds_land_retrieve:main"
"cds_reanalysis_retrieve.py" = "model_harmonics.datasets.cds_reanalysis_retrieve:main"
"ecmwf_reanalysis_retrieve.py" = "model_harmonics.datasets.ecmwf_reanalysis_retrieve:main"
"gesdisc_gldas_sync.py" = "model_harmonics.datasets.gesdisc_gldas_sync:main"
"gesdisc_merra_monthly.py" = "model_harmonics.datasets.gesdisc_merra_monthly:main"
"gesdisc_merra_subset.py" = "model_harmonics.datasets.gesdisc_merra_subset:main"
"gesdisc_merra_sync.py" = "model_harmonics.datasets.gesdisc_merra_sync:main"
"jpl_ecco_cube92_sync.py" = "model_harmonics.datasets.jpl_ecco_cube92_sync:main"
"jpl_ecco_llc_sync.py" = "model_harmonics.datasets.jpl_ecco_llc_sync:main"
"jpl_ecco_realtime_sync.py" = "model_harmonics.datasets.jpl_ecco_realtime_sync:main"
"jpl_ecco_v4_sync.py" = "model_harmonics.datasets.jpl_ecco_v4_sync:main"
"jpl_ecco_webdav.py" = "model_harmonics.datasets.jpl_ecco_webdav:main"
"noaa_cdc_ncep_ftp.py" = "model_harmonics.datasets.noaa_cdc_ncep_ftp:main"
"ucar_gdex_cfsr_surface.py" = "model_harmonics.datasets.ucar_gdex_cfsr_surface:main"
"ucar_gdex_jra3q_levels.py" = "model_harmonics.datasets.ucar_gdex_jra3q_levels:main"
"ucar_gdex_jra3q_surface.py" = "model_harmonics.datasets.ucar_gdex_jra3q_surface:main"
"ucar_gdex_jra55_surface.py" = "model_harmonics.datasets.ucar_gdex_jra55_surface:main"
# Atmospheric Circulation (reanalysis)
"model_level_coefficients.py" = "model_harmonics.reanalysis.model_level_coefficients:main"
"reanalysis_atmospheric_harmonics.py" = "model_harmonics.reanalysis.reanalysis_atmospheric_harmonics:main"
"reanalysis_geopotential_heights.py" = "model_harmonics.reanalysis.reanalysis_geopotential_heights:main"
"reanalysis_inverse_barometer.py" = "model_harmonics.reanalysis.reanalysis_inverse_barometer:main"
"reanalysis_mean_harmonics.py" = "model_harmonics.reanalysis.reanalysis_mean_harmonics:main"
"reanalysis_mean_pressure.py" = "model_harmonics.reanalysis.reanalysis_mean_pressure:main"
"reanalysis_monthly_harmonics.py" = "model_harmonics.reanalysis.reanalysis_monthly_harmonics:main"
"reanalysis_monthly_pressure.py" = "model_harmonics.reanalysis.reanalysis_monthly_pressure:main"
"reanalysis_pressure_harmonics.py" = "model_harmonics.reanalysis.reanalysis_pressure_harmonics:main"
# Glacial Isostatic Adjustment (GIA)
"GIA_GSFC_mascons.py" = "model_harmonics.GIA.GIA_GSFC_mascons:main"
"GIA_spatial_maps.py" = "model_harmonics.GIA.GIA_spatial_maps:main"
"GIA_uplift_ICESat2_ATL15.py" = "model_harmonics.GIA.GIA_uplift_ICESat2_ATL15:main"
# Ocean Bottom Pressure (OBP)
"ecco_geoid_llc_tiles.py" = "model_harmonics.OBP.ecco_geoid_llc_tiles:main"
"ecco_llc_tile_harmonics.py" = "model_harmonics.OBP.ecco_llc_tile_harmonics:main"
"ecco_mean_llc_tiles.py" = "model_harmonics.OBP.ecco_mean_llc_tiles:main"
"ecco_mean_realtime.py" = "model_harmonics.OBP.ecco_mean_realtime:main"
"ecco_mean_version4.py" = "model_harmonics.OBP.ecco_mean_version4:main"
"ecco_monthly_harmonics.py" = "model_harmonics.OBP.ecco_monthly_harmonics:main"
"ecco_read_llc_tiles.py" = "model_harmonics.OBP.ecco_read_llc_tiles:main"
"ecco_read_realtime.py" = "model_harmonics.OBP.ecco_read_realtime:main"
"ecco_read_version4.py" = "model_harmonics.OBP.ecco_read_version4:main"
"gebco_ocean_depth.py" = "model_harmonics.OBP.gebco_ocean_depth:main"
# Seismic (seismic)
"seismic_monthly_harmonics.py" = "model_harmonics.seismic.seismic_monthly_harmonics:main"
# Surface Mass Balance (SMB)
"era5_smb_cumulative.py" = "model_harmonics.SMB.era5_smb_cumulative:main"
"era5_smb_harmonics.py" = "model_harmonics.SMB.era5_smb_harmonics:main"
"era5_smb_mean.py" = "model_harmonics.SMB.era5_smb_mean:main"
"gemb_smb_cumulative.py" = "model_harmonics.SMB.gemb_smb_cumulative:main"
"gemb_smb_harmonics.py" = "model_harmonics.SMB.gemb_smb_harmonics:main"
"merra_hybrid_cumulative.py" = "model_harmonics.SMB.merra_hybrid_cumulative:main"
"merra_hybrid_harmonics.py" = "model_harmonics.SMB.merra_hybrid_harmonics:main"
"merra_smb_cumulative.py" = "model_harmonics.SMB.merra_smb_cumulative:main"
"merra_smb_harmonics.py" = "model_harmonics.SMB.merra_smb_harmonics:main"
"merra_smb_mask.py" = "model_harmonics.SMB.merra_smb_mask:main"
"merra_smb_mean.py" = "model_harmonics.SMB.merra_smb_mean:main"
"racmo_downscaled_cumulative.py" = "model_harmonics.SMB.racmo_downscaled_cumulative:main"
"racmo_downscaled_mean.py" = "model_harmonics.SMB.racmo_downscaled_mean:main"
"racmo_downscaled_harmonics.py" = "model_harmonics.SMB.racmo_downscaled_harmonics:main"
"racmo_smb_cumulative.py" = "model_harmonics.SMB.racmo_smb_cumulative:main"
"racmo_smb_harmonics.py" = "model_harmonics.SMB.racmo_smb_harmonics:main"
# Terrestrial Water Storage (TWS)
"era5_land_mask_arctic.py" = "model_harmonics.TWS.era5_land_mask_arctic:main"
"era5_land_mask_permafrost.py" = "model_harmonics.TWS.era5_land_mask_permafrost:main"
"era5_land_mean_monthly.py" = "model_harmonics.TWS.era5_land_mean_monthly:main"
"era5_land_monthly_harmonics.py" = "model_harmonics.TWS.era5_land_monthly_harmonics:main"
"era5_land_read_monthly.py" = "model_harmonics.TWS.era5_land_read_monthly:main"
"gldas_mask_arctic.py" = "model_harmonics.TWS.gldas_mask_arctic:main"
"gldas_mask_permafrost.py" = "model_harmonics.TWS.gldas_mask_permafrost:main"
"gldas_mask_vegetation.py" = "model_harmonics.TWS.gldas_mask_vegetation:main"
"gldas_mean_monthly.py" = "model_harmonics.TWS.gldas_mean_monthly:main"
"gldas_monthly_harmonics.py" = "model_harmonics.TWS.gldas_monthly_harmonics:main"
"gldas_read_3hourly.py" = "model_harmonics.TWS.gldas_read_3hourly:main"
"gldas_read_monthly.py" = "model_harmonics.TWS.gldas_read_monthly:main"
"gldas_scaling_factors.py" = "model_harmonics.TWS.gldas_scaling_factors:main"

[tool.setuptools.packages.find]
exclude = ["test*", "run*"]

[tool.pytest.ini_options]
minversion = "6.0"
norecursedirs = ".git"
addopts = "-n auto --verbose --capture=no"
python_files = [
    "test*.py"
]
testpaths = [
    "test"
]

[tool.coverage.run]
branch = true
source = [
    "model_harmonics",
    "test",
]
omit = [
    "setup.py",
    "conf.py",
    "GIA/*",
    "OBP/*",
    "reanalysis/*",
    "scripts/*",
    "seismic/*",
    "SMB/*",
    "TWS/*",
]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.ruff]
line-length = 80
indent-width = 4

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = false

[tool.pixi.workspace]
name = "model-harmonics"
authors = ["model-harmonics contributors"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
model-harmonics = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev", "doc"], solve-group = "default" }
doc = { features = ["doc"], solve-group = "default" }
grib = { features = ["grib"], solve-group = "default" }

[tool.pixi.tasks.export-env]
args = [ { "arg" = "flags", "default" = "" } ]
cmd = "pixi workspace export conda-environment {{ flags }} > environment.yml"
description = "Export workspace to a conda environment file" 

[tool.pixi.feature.doc.tasks.docs]
args = [ { "arg" = "builder", "default" = "html"}, { "arg" = "flags", "default" = "" } ]
cmd = "make {{ builder }} {{ flags }}"
cwd = "doc"
description = "Create documentation with sphinx"

[tool.pixi.feature.doc.tasks.clean-docs]
args = [ { "arg" = "builder", "default" = "html"}, { "arg" = "flags", "default" = "" } ]
cmd = "make clean && make {{ builder }} {{ flags }}"
cwd = "doc"
description = "Remove build artifacts and rebuild the documentation with sphinx"

[tool.pixi.feature.dev.tasks.test]
args = [ { "arg" = "flags", "default" = "" }, { "arg" = "test", "default" = "." } ]
cmd = "pytest {{ flags }} {{ test }}"
cwd = "test"
description = "Run the pytest suite"

[tool.pixi.feature.dev.tasks.lint]
args = [ { "arg" = "flags", "default" = "--select=E9,F63,F7,F82 --show-source" }, { "arg" = "test", "default" = "." } ]
cmd = "flake8 {{ test }} --count {{ flags }} --statistics --extend-exclude 'build/,run/,*.ipynb_checkpoints/,.pixi/'"
description = "Run flake8 to check for compilation errors"

[tool.pixi.dependencies]
cdsapi = "*"
ecmwf-datastores-client = "*"
fiona = "*"
geoid-toolkit = "*"
gravity-toolkit = "*"
h5py = "*"
netcdf4 = "*"
pyproj = "*"
shapely = "*"
scikit-learn = "*"

[tool.pixi.feature.dev.dependencies]
flake8 = "*"
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"

[tool.pixi.feature.doc.dependencies]
docutils = "*"
graphviz = "*"
markupsafe = "*"
myst-nb = "*"
numpydoc = "*"
sphinx = "*"
sphinx-argparse = "*"
sphinxcontrib-bibtex = "*"
sphinx-design = "*"
sphinx_rtd_theme = "*"

[tool.pixi.feature.grib.dependencies]
cython = "*"
eccodes = "*"
pygrib = "*"
